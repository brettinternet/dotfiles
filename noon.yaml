# yaml-language-server: $schema=https://raw.githubusercontent.com/brettinternet/noon/main/noon.schema.json
version: 1
timezone: Local

jobs:
  pull:
    description: Fast-forward main from origin when clean.
    schedule: "55 5-16 * * *"
    run: >-
      git fetch --quiet --prune origin &&
      [ "$(git branch --show-current)" = main ] &&
      git diff --quiet --ignore-submodules HEAD &&
      git merge-base --is-ancestor HEAD origin/main
      || exit 3;
      git merge --ff-only --quiet origin/main
    noop_exit_code: 3
    timeout: 5m
    missed: skip

  darwin:
    description: Install macOS dotfiles each morning.
    schedule: every day at 6am
    os: [darwin]
    run: make darwin
    on_failure: >-
      exec tell --config noon-tell.yaml --timeout 10s notify --type failure --title dotfiles
      "make darwin ${NOON_STATUS}. See noon logs ${NOON_RUN_ID}."

  ai:
    description: Install AI dotfiles each morning.
    schedule: every day at 6:05am
    run: direnv exec ~ make ai
    on_failure: >-
      exec tell --config noon-tell.yaml --timeout 10s notify --type failure --title dotfiles
      "make ai ${NOON_STATUS}. See noon logs ${NOON_RUN_ID}."

  update:
    description: Install AI dotfiles each morning.
    schedule: every day at 6:10am
    run: make up
    on_failure: >-
      exec tell --config noon-tell.yaml --timeout 10s notify --type failure --title dotfiles
      "make up ${NOON_STATUS}. See noon logs ${NOON_RUN_ID}."
