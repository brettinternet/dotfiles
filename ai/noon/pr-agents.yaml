# yaml-language-server: $schema=https://raw.githubusercontent.com/brettinternet/noon/main/noon.schema.json
# Generic PR agent jobs. `task ai:noon-setup -- REPO...` links this as .git/noon.yaml; keep logins in
# the repo's .git/noon/pr-agents.env, never here. {repo} and {env:NAME} come from agent-job, and gh
# defaults to the checkout. noon-notify sends through Tell only when a Tell config such as
# .git/tell.yaml exists.
# Env: see pr-agents.env.
version: 1
timezone: Local
vars_file: .git/noon/pr-agents.env

jobs:
  fetch:
    description: Fetch and prune origin
    schedule: "*/15 6-16 * * 1-4"
    run: [git, fetch, --quiet, --prune, origin]
    timeout: 5m
    missed: skip

  babysit:
    description: One PR babysitter pass whenever my non-draft PRs change
    schedule: "${BABYSIT_SCHEDULE:-*/15 7-14 * * 1-4}"
    jitter: "${BABYSIT_JITTER:-1s}"
    env_file: .git/noon/pr-agents.env
    run:
      - agent-job
      - launch
      - babysit
      - /skill:pr-babysit repo:{repo} author:@me {env?:BABYSIT_ARGS}
      - >-
        gh pr list --author @me --state open --search draft:false
        --json number,headRefOid,updatedAt,mergeable,reviewDecision,statusCheckRollup
        --jq 'if length == 0 then empty else map([.number, .headRefOid, .updatedAt, .mergeable, .reviewDecision,
        ([.statusCheckRollup[] | (.conclusion | select(. != "")) // .status // .state] | unique)]) | tojson end'
    noop_exit_code: 3
    timeout: "${AGENT_JOB_TIMEOUT:-3h}"
    on_failure: [noon-notify, It may be waiting on you.]
    missed: skip

  review:
    description: One PR review pass whenever matching PRs by REVIEW_AUTHORS change
    schedule: "${REVIEW_SCHEDULE:-*/15 6-14 * * 1-4}"
    jitter: "${REVIEW_JITTER:-1s}"
    env_file: .git/noon/pr-agents.env
    run:
      - agent-job
      - launch
      - review
      - >-
        /skill:pr-review repo:{repo} archived:false draft:false author:{env:REVIEW_AUTHORS} {env?:REVIEW_SEARCH}
        -- After each completed PR review (APPROVE, COMMENT, or WAIT), append its canonical GitHub PR URL
        as one line to noon/reviews/YYYY-MM-DD.log under this checkout's absolute Git common directory
        (resolve with git rev-parse --path-format=absolute --git-common-dir before changing directories),
        using the local date at completion. Create the directory if needed and append without overwriting existing entries. Log APPROVE and
        COMMENT only after GitHub confirms the review was posted; do not log skipped or failed reviews.
        Keep previous daily logs. If logging fails, report it without reposting the GitHub review.
      - >-
        set -ef; base="draft:false ${REVIEW_SEARCH:-}"; if [ "$REVIEW_AUTHORS" = "*" ]; then searches=("$base -author:@me");
        else searches=(); for author in ${REVIEW_AUTHORS//,/ }; do searches+=("$base author:$author"); done; fi;
        for search in "${searches[@]}"; do gh pr list --state open --limit 1000 --search "$search"
        --json number,headRefOid,updatedAt --jq '.[] | [.number, .headRefOid, .updatedAt] | tojson'; done
    noop_exit_code: 3
    timeout: "${AGENT_JOB_TIMEOUT:-3h}"
    on_failure: [noon-notify, It may be waiting on you.]
    missed: skip
