# https://github.com/can1357/oh-my-pi/blob/3f0c2c63a0d53a9d2587f7405ea65b8ceb59249d/docs/settings.md
---
startup:
  quiet: true
  checkUpdate: false
hideThinkingBlock: false
advisor:
  enabled: false
theme:
  dark: dark-terminal
symbolPreset: nerd
tui:
  titleState: false
steeringMode: all
statusLine:
  preset: default
  separator: powerline-thin
  compactThinkingLevel: false
composer:
  shape: box
display:
  showTokenUsage: false
compaction:
  thresholdPercent: -1 # adaptive reserve-based default (~85% / 38.4k buffer at 256k; auto-scales with contextWindow)
loop:
  mode: reset
doubleEscapeAction: tree
github:
  enabled: false
computer:
  enabled: true
commands:
  enableOpencodeUser: false
  enableOpencodeProject: false
  enableClaudeProject: true
  enableClaudeUser: true
setupVersion: 2
codexResets:
  autoRedeem: "no"
