version: 1

piLaunchers:
  fast: { model: or-flash, thinking: high }
  oracle: { model: claude-fable, thinking: high }
  solo: { args: [--exclude-tools, "subagent,subagent_wait,subagent_supervisor"] }

# Pi model IDs; aliases keep profiles concise. `context: conservative` keeps context small by
# setting the window to 272K; omit it on models whose native window is smaller.
models:
  codex-sol:
    id: openai-codex/gpt-6-sol
    context: conservative
  codex-luna:
    id: openai-codex/gpt-6-luna
    context: conservative
  codex-astra:
    id: openai-codex/gpt-6-astra
    context: conservative

  claude-fable:
    id: anthropic/claude-fable-5-1
    context: conservative
  claude-opus:
    id: anthropic/claude-opus-5-5
    context: conservative
  claude-sonnet:
    id: anthropic/claude-sonnet-5
    context: conservative
  claude-haiku:
    id: anthropic/claude-haiku-4-5

  or-sol:
    id: openrouter/openai/gpt-6-sol
    context: conservative
  or-luna:
    id: openrouter/openai/gpt-6-luna
    context: conservative
  or-sol-pro:
    id: openrouter/openai/gpt-6-sol-pro
    context: conservative
  or-fable-auto:
    id: openrouter/~anthropic/claude-fable-latest
    context: conservative
  or-opus:
    id: openrouter/anthropic/claude-opus-5.5
    context: conservative
  or-gemini-writer:
    id: openrouter/google/gemini-3.8-flash
    context: conservative
  or-flash:
    id: openrouter/deepseek/deepseek-v4-flash-0731
    context: conservative
  or-glm:
    id: openrouter/z-ai/glm-5.3
    context: conservative

# Each pair is [model alias, Pi thinking level].
# The claude and codex profiles' agents also set standalone Claude Code and Codex CLI agent models.
profiles:
  codex:
    parent: [codex-sol, high]
    enabled: [codex-luna, codex-sol, codex-astra, claude-opus]
    defaultSubagent: [codex-luna, max]
    researcher: [codex-luna, medium]
    title: [codex-luna, low]
    progress: [codex-luna, low]
    agents:
      reviewer: [codex-sol, max]
      oracle: [codex-astra, max]
      explore: [codex-luna, high]
      executor: [codex-luna, max]
      verifier: [codex-luna, high]
      pr-watcher: [codex-luna, low]
      thermo-nuclear-code-quality-review: [codex-astra, max]
      writer: [codex-sol, low]
    modelScope: [openai-codex/gpt-6-*]
    settings:
      webSearchConfig:
        searchRouting:
          providers: [openai]
          useCurrentModel: true
          fallbackOn: [unsupported, transient, quota, network, invalid-response]

  claude:
    parent: [claude-sonnet, medium]
    enabled: [claude-sonnet, claude-opus, claude-haiku]
    defaultSubagent: [claude-haiku, medium]
    researcher: [claude-haiku, medium]
    title: [claude-haiku, off]
    progress: [claude-haiku, off]
    agents:
      reviewer: [claude-opus, xhigh]
      oracle: [claude-opus, xhigh]
      explore: [claude-haiku, medium]
      executor: [claude-sonnet, high]
      verifier: [claude-sonnet, high]
      pr-watcher: [claude-haiku, medium]
      thermo-nuclear-code-quality-review: [claude-opus, xhigh]
      writer: [claude-sonnet, low]
    modelScope: [anthropic/*]

  openrouter:
    output: or
    parent: [or-opus, medium]
    enabled: [or-sol, or-luna, or-sol-pro, or-fable-auto, or-opus, or-glm, or-gemini-writer]
    defaultSubagent: [or-luna, max]
    researcher: [or-luna, max]
    title: [or-flash, off]
    progress: [or-flash, off]
    agents:
      reviewer: [or-opus, xhigh]
      oracle: [or-opus, high]
      explore: [or-luna, low]
      executor: [or-luna, max]
      verifier: [or-luna, high]
      pr-watcher: [or-luna, low]
      thermo-nuclear-code-quality-review: [or-opus, xhigh]
      writer: [or-gemini-writer, medium]
    modelScope: [openrouter/*]
    settings:
      extensions: [$DOTFILES/ai/pi/extensions/dcg-guard.ts, $DOTFILES/ai/pi/extensions/openrouter-web-search.ts]
      subagents:
        agentOverrides:
          writer:
            fallbackModels: [openrouter/anthropic/claude-opus-5.5:medium]
      webSearchConfig: { tools: { webSearch: { enabled: false } } }
