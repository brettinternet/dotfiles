# Initial DeepSeek Harness settings. ai.yaml copies this file to
# ~/.dsh/settings.yaml once; the web GUI and TUI then update that local copy.
# Never store secrets here: values are apiKeyEnv references resolved from the
# process environment, ~/.dsh/.env, or ~/.dsh/.credentials.yaml.
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: deepseek-official
  model: deepseek-v4-pro
  reasoningEffort: max

# Extra providers live under llm-pi-ai. Keys resolve from the environment, so
# uncommenting any of these works wherever the matching env var is exported.
# OAuth-backed routes (subscriptions) name no key at all; sign in once per
# machine with /login in dsh-tui and never sync the stored grant.
#
# llm-pi-ai:
#   providers:
#     openrouter:
#       apiKeyEnv: OPENROUTER_API_KEY
#     anthropic:
#       apiKeyEnv: ANTHROPIC_API_KEY
#     openai-codex: {}
