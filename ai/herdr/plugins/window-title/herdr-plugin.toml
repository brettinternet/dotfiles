id = "brett.window-title"
name = "Active pane window title"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Mirror the focused pane title to the outer terminal"
platforms = ["macos"]

[[startup]]
command = ["sh", "sync-title.sh"]

[[events]]
on = "workspace.focused"
command = ["sh", "sync-title.sh"]

[[events]]
on = "tab.focused"
command = ["sh", "sync-title.sh"]

[[events]]
on = "pane.focused"
command = ["sh", "sync-title.sh"]
