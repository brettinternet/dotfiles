onboarding = false

[theme]
# Follow the host terminal's ANSI palette, like base/.tmux.conf does.
name = "terminal"

[theme.custom]
# Use Kaile's dark UI surfaces instead of ANSI gray as a background/text color.
active_row_bg = "#202020"
selection_bg = "#2a2a2a"
surface0 = "#181818"
surface1 = "#202020"
surface_dim = "#202020"

[keys]
prefix = "ctrl+a"                               # remove to avoid conflict with tmux if nesting
split_horizontal = ["prefix+minus", "prefix+s"] # from tmux
split_vertical = "prefix+v"
rename_tab = "prefix+,"
close_pane = "prefix+shift+x"                   # what I'm used to from tmux
close_tab = "prefix+shift+d"                    # overwrites close workspace
previous_agent = "prefix+p"
next_agent = "prefix+n"
focus_agent = "prefix+alt+1..9"
new_workspace = "prefix+shift+c"
switch_workspace = "prefix+shift+1..9"
previous_workspace = "prefix+["
next_workspace = "prefix+]"
#goto = "prefix+g"
detach = ["prefix+d", "prefix+ctrl+d"]

[[keys.command]]
key = "prefix+t"
type = "popup"
#command = "exec \"${SHELL:-sh}\""
command = "lazygit"
description = "open lazygit"
width = 140
height = 60

[[keys.command]]
key = "prefix+u"
type = "popup"
command = "mise exec gdu -- gdu"
description = "open gdu"
width = 140
height = 60

[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = "herdr-split-before horizontal"
description = "split horizontal before current pane"

[[keys.command]]
key = "prefix+shift+v"
type = "shell"
command = "herdr-split-before vertical"
description = "split vertical before current pane"

[[keys.command]]
key = "prefix+shift+z"
type = "plugin_action"
command = "brett.pane-collapse.toggle"
description = "toggle focused pane collapse"

[[keys.command]]
key = "prefix+plus"
type = "plugin_action"
command = "brett.pane-equalize.equalize"
description = "equalize panes in focused tab"

[[keys.command]]
key = "prefix+shift+left"
type = "plugin_action"
command = "brett.pane-rotate.left"
description = "rotate focused pane with direct left neighbor"

[[keys.command]]
key = "prefix+shift+right"
type = "plugin_action"
command = "brett.pane-rotate.right"
description = "rotate focused pane with direct right neighbor"

[[keys.command]]
key = "prefix+shift+up"
type = "plugin_action"
command = "brett.pane-rotate.up"
description = "rotate focused pane with direct upper neighbor"

[[keys.command]]
key = "prefix+shift+down"
type = "plugin_action"
command = "brett.pane-rotate.down"
description = "rotate focused pane with direct lower neighbor"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "brett.last-workspace.toggle"
description = "toggle last workspace"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "brett.command-palette.open"
description = "open command palette"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "brett.command-palette.open-workspace-picker"
description = "go to workspace with preview"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "brett.command-palette.open-workspace-overview"
description = "open workspace overview"

[[keys.command]]
key = "prefix+ctrl+h"
type = "plugin_action"
command = "brett.seamless-navigation.navigate-left"
description = "navigate left"

[[keys.command]]
key = "prefix+ctrl+j"
type = "plugin_action"
command = "brett.seamless-navigation.navigate-down"
description = "navigate down"

[[keys.command]]
key = "prefix+ctrl+k"
type = "plugin_action"
command = "brett.seamless-navigation.navigate-up"
description = "navigate up"

[[keys.command]]
key = "prefix+ctrl+l"
type = "plugin_action"
command = "brett.seamless-navigation.navigate-right"
description = "navigate right"

[[keys.command]]
key = "alt+shift+h"
type = "plugin_action"
command = "brett.seamless-navigation.resize-left"
description = "resize left"

[[keys.command]]
key = "alt+shift+j"
type = "plugin_action"
command = "brett.seamless-navigation.resize-down"
description = "resize down"

[[keys.command]]
key = "alt+shift+k"
type = "plugin_action"
command = "brett.seamless-navigation.resize-up"
description = "resize up"

[[keys.command]]
key = "alt+shift+l"
type = "plugin_action"
command = "brett.seamless-navigation.resize-right"
description = "resize right"

[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = "herdr-open-dev-dir"
description = "open development directory"
width = 60
height = 15

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "herdr-insert-file-path"
description = "insert file path at cursor"
width = 60
height = 25

[ui]
# Order the Agent panel as an attention queue rather than by space, so whoever
# is blocked surfaces first.
agent_panel_sort = "priority"
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true
show_agent_labels_on_pane_borders = true
sidebar_collapsed_mode = "hidden"

[ui.sidebar.agents]
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true },
    "tab",
  ],
  [
    { token = "agent", fg = "#7dcfff" },
    "state_text",
  ],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  [
    "state_icon",
    { token = "workspace", bold = true },
    "tab",
  ],
  [
    { token = "terminal_title_stripped", fg = "#c0caf5" },
  ],
]
opencode = [
  [
    "state_icon",
    { token = "workspace", bold = true },
    "tab",
  ],
  [
    { token = "terminal_title_stripped", fg = "#c0caf5" },
  ],
]


[ui.toast]
# Let the outer terminal own notifications; this also works over `herdr --remote`.
delivery = "terminal"

[experimental]
kitty_graphics = true
# CAO launches agent workspaces from a Herdr-managed pane.
allow_nested = true

# Herdr 0.8.2 can leave new split PTYs at the pre-split width; zoom/unzoom fixes it.
# Watch https://github.com/herdrdev/herdr/issues/1709; related resize fix: https://github.com/herdrdev/herdr/issues/471
