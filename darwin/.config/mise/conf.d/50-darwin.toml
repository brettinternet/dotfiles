#:schema https://mise.en.dev/schema/mise.json

[tools]
# personal
"github:brettinternet/worklease" = { version = "latest", minimum_release_age = "0" }
"github:brettinternet/panelctl" = { version = "latest", minimum_release_age = "0", matching_regex = '^panelctl-cli-v.*-macos-universal\.zip$' }
"github:brettinternet/hum" = { version = "latest", minimum_release_age = "0" }

# dev
go = "latest"
rust = "latest"
ruby = "latest"
uv = "latest"
bun = "latest"
k9s = "latest"
gh = { version = "latest", postinstall = "gh extension install github/gh-stack --force" }
biome = "latest"
"vfox:jdx/vfox-eza" = "latest"
"gem:vimgolf" = { version = "latest", depends = ["ruby"] }

# ai
"npm:@anthropic-ai/claude-code" = { version = "latest", minimum_release_age = "0" }
opencode = "latest"
codex = "latest"
"npm:@earendil-works/pi-coding-agent" = { version = "latest", minimum_release_age = "0" }
"github:can1357/oh-my-pi" = "latest"
# dsh is prerelease-only, so mise cannot resolve its `latest` selector yet.
"npm:@deepseek-ai/dsh" = "0.1.1-rc.2"
amp = { version = "latest", depends = ["bun"], minimum_release_age = "0", postinstall = 'cd "$MISE_TOOL_INSTALL_PATH" && "${MISE_DATA_DIR:-$HOME/.local/share/mise}/installs/bun/latest/bin/bun" pm trust @ampcode/cli' }
ast-grep = "latest"

# lsp
# lua-language-server, marksman, ruff and taplo live in the base fragment so the
# Linux servers get them too; only runtime-dependent servers are listed here.
"go:golang.org/x/tools/gopls" = "latest"
"npm:pyright" = "latest"
# Pinned to 5.x deliberately: typescript-language-server drives `tsserver.js`,
# which TypeScript 7 no longer ships. `latest` here silently breaks ts_ls.
"npm:typescript" = "7"
"npm:typescript-language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:yaml-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
erlang = "latest"
elixir = "latest"
"github:elixir-lsp/elixir-ls" = { version = "latest", postinstall = "ln -sf \"$MISE_TOOL_INSTALL_PATH/language_server.sh\" \"$MISE_TOOL_INSTALL_PATH/elixir-ls\"" }

# containers
lima = "latest"
colima = "latest"
docker-cli = "latest"
[tools."npm:@deepseek-harness-tui/dsh-tui"]
# 0.10.0-beta.5 was published with unresolved workspace: and link: dependencies.
version = "0.9.3"
depends = ["bun", "npm:@deepseek-ai/dsh"]

[tools.docker-compose]
version = "latest"
postinstall = '''
mkdir -p ~/.docker/cli-plugins ~/.local/bin
compose_plugin="$MISE_TOOL_INSTALL_PATH/docker-compose"
ln -sf "$compose_plugin" ~/.docker/cli-plugins/docker-compose
ln -sf "$compose_plugin" ~/.local/bin/docker-compose
'''

[settings]
disable_backends = ["pipx"]
pipx.uvx = true
npm.package_manager = "bun"
experimental = true
github.credential_command = "gh auth token"

