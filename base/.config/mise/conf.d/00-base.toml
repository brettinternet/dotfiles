#:schema https://mise.en.dev/schema/mise.json

[tools]
# helpers
task = "latest"
tmux = "latest"
neovim = "latest"
tree-sitter = "latest"
sops = "latest"
lazygit = "latest"
delta = "latest"
slsa-verifier = "latest"
cosign = "latest"
gdu = "latest"
herdr = { version = "latest", minimum_release_age = "0" }
python = "latest"
node = "latest"

# search
fd = "latest"
fzf = "latest"
rg = "latest"
zoxide = "latest"
yq = "latest"
jq = "latest"

# lsp
# These servers cover the languages edited on every machine, including the
# Arch/Debian servers. Python and Node are base runtimes because the shared
# Herdr plugins use them.
lua-language-server = "latest"
marksman = "latest"
ruff = "latest"
taplo = "latest"
