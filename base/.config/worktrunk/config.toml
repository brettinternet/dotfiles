# Git owns checkouts, Worktrunk owns preparation, Herdr owns their UI.
worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

[post-start]
herdr = '''
if [ "${HERDR_ENV:-}" = "1" ]; then
  herdr worktree open --cwd {{ repo_path }} --path {{ worktree_path }} --label {{ worktree_name }} --no-focus
fi
'''
