# Git owns checkouts, Worktrunk owns preparation, Herdr owns their UI.
worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

[pre-start]
agent-receipt = '''
python3 "$HOME/.config/worktrunk/record-agent-worktree.py"
'''
# Opt-in per repo: copies only gitignored files listed in the primary
# checkout's (globally ignored) .worktreeinclude; no-op without one.
copy-local = "wt step copy-ignored --require-include"

[post-start]
herdr = '''
if [ "${HERDR_ENV:-}" = "1" ]; then
  herdr_focus_flag=--no-focus
  if [ "${WORKTRUNK_HERDR_FOCUS:-}" = "1" ]; then
    herdr_focus_flag=--focus
  fi
  herdr worktree open --cwd {{ repo_path }} --path {{ worktree_path }} --label {{ worktree_name }} "$herdr_focus_flag"
fi
'''

[post-remove]
herdr = '''
python3 "$HOME/.config/worktrunk/close-herdr-workspace.py" {{ worktree_path }}
'''
