# Git owns checkouts, Worktrunk owns preparation, Herdr owns their UI.
worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

[post-start]
herdr = '''
if [ "${HERDR_ENV:-}" = "1" ]; then
  herdr_focus_flag=--no-focus
  if [ "${WORKTRUNK_HERDR_FOCUS:-}" = "1" ]; then
    herdr_focus_flag=--focus
  fi
  herdr worktree open --cwd {{ repo_path }} --path {{ worktree_path }} --label {{ worktree_name }} "$herdr_focus_flag"
fi
'''

[post-remove]
herdr = '''
python3 "$HOME/.config/herdr/plugins/local/worktrunk/close.py" {{ worktree_path }}
'''
