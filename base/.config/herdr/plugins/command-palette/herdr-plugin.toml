id = "brett.command-palette"
name = "Command palette"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Search and invoke installed Herdr plugin actions"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open command palette"
contexts = ["workspace"]
command = ["sh", "open.sh"]

[[actions]]
id = "open-workspace-picker"
title = "Go to workspace with preview"
contexts = ["workspace"]
command = ["sh", "open-workspace-picker.sh"]

[[actions]]
id = "open-workspace-overview"
title = "Open workspace overview"
contexts = ["workspace"]
command = ["sh", "open-workspace-overview.sh"]

[[panes]]
id = "palette"
title = "Command palette"
placement = "popup"
width = 40
height = 20
command = ["sh", "palette.sh"]

[[panes]]
id = "workspace-picker"
title = "Go to workspace"
placement = "popup"
width = 140
height = 60
command = ["python3", "workspace-picker.py"]

[[panes]]
id = "workspace-overview"
title = "Workspace overview"
placement = "popup"
width = "100%"
height = "100%"
command = ["python3", "workspace-overview.py"]
