id = "brett.previous-pane-focus"
name = "Focus previous pane on close"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "When a pane closes, restore the nearest previously focused pane in the same tab"
platforms = ["linux", "macos"]

[[events]]
on = "pane.focused"
command = ["sh", "track-focus.sh"]

[[events]]
on = "pane.closed"
command = ["sh", "restore-previous.sh"]
