id = "brett.pane-rotate"
name = "Rotate neighboring panes"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Toggle the split axis shared by the focused pane and a declared neighbor"
platforms = ["linux", "macos"]

[[actions]]
id = "left"
title = "Rotate with left pane"
contexts = ["pane"]
command = ["python3", "rotate.py"]

[[actions]]
id = "right"
title = "Rotate with right pane"
contexts = ["pane"]
command = ["python3", "rotate.py"]

[[actions]]
id = "up"
title = "Rotate with upper pane"
contexts = ["pane"]
command = ["python3", "rotate.py"]

[[actions]]
id = "down"
title = "Rotate with lower pane"
contexts = ["pane"]
command = ["python3", "rotate.py"]
