---
# https://github.com/anishathalye/dotbot/tree/master#directives

- defaults:
    link:
      create: true
      relink: true

- clean:
    - "~"
    - "~/.config"
    - "~/.functions"
    - "~/.bin"

- link:
    ~/.bash_profile:
      path: base/.bash_profile
      force: true
    ~/.bashrc:
      path: base/.bashrc
      force: true
    ~/.dircolors:
      path: base/.dircolors
      if: "command -v dircolors >/dev/null 2>&1"
    ~/.zshrc:
      path: base/.zshrc
      if: '[ -x "$(command -v zsh)" ]'
      force: true
    ~/.editorconfig:
      path: base/.editorconfig
    ~/.profile:
      path: base/.profile
    ~/.ssh/config.d/github.conf:
      path: base/.ssh/config.d/github.conf
    ~/.vimrc:
      path: base/.vimrc
      force: true
      if: '[ -x "$(command -v vim)" ]'
    ~/.vimrc.bundles:
      path: base/.vimrc.bundles
      if: '[ -x "$(command -v vim)" ]'
    ~/.tmux.conf:
      path: base/.tmux.conf
      if: '[ -x "$(command -v tmux)" ]'
    ~/.config/lazygit/config.yml:
      path: base/.config/lazygit/config.yml
      force: true
      if: '[ "$(uname)" = Linux ] && [ -x "$(command -v lazygit)" ]'
    ~/Library/Application Support/lazygit/config.yml:
      path: base/.config/lazygit/config.yml
      force: true
      if: '[ "$(uname)" = Darwin ] && [ -x "$(command -v lazygit)" ]'
    ~/.config/k9s/config.yaml:
      path: base/.config/k9s/config.yaml
      if: '[ "$(uname)" = Linux ] && [ -x "$(command -v kubectl)" ]'
    ~/.config/k9s/skins/skin.yaml:
      path: base/.config/k9s/skin.yaml
      if: '[ "$(uname)" = Linux ] && [ -x "$(command -v kubectl)" ]'
    ~/Library/Application Support/k9s/config.yaml:
      path: base/.config/k9s/config.yaml
      if: '[ "$(uname)" = Darwin ] && [ -x "$(command -v kubectl)" ]'
    ~/Library/Application Support/k9s/skins/skin.yaml:
      path: base/.config/k9s/skin.yaml
      if: '[ "$(uname)" = Darwin ] && [ -x "$(command -v kubectl)" ]'
    ~/.config/nushell/config.nu:
      path: base/nushell/config.nu
      force: true
      if: '[ "$(uname)" = Linux ]'
    ~/.config/nushell/conf.d/:
      glob: true
      path: base/nushell/conf.d/*
      if: '[ "$(uname)" = Linux ]'
    ~/.config/mise/conf.d/:
      glob: true
      path: base/.config/mise/conf.d/*
      if: '[ -x "$(command -v mise)" ]'
    ~/.config/herdr/config.toml:
      path: base/.config/herdr/config.toml
      backup: true
    ~/.config/hwt/config.yaml:
      path: base/.config/hwt/config.yaml
      backup: true
    ~/.config/nvim:
      path: base/.config/nvim
      if: '[ -x "$(command -v nvim)" ]'
    ~/.bin/:
      glob: true
      path: base/.bin/*
    ~/.functions/:
      glob: true
      path: base/.functions/*
    ~/.functions/pacman.sh:
      path: base/platform/pacman.sh
      if: '[ "$(uname)" = Linux ] && [ -x "$(command -v pacman)" ]'
    ~/.zshrc.linux:
      path: base/platform/.zshrc.linux
      if: '[ "$(uname)" = Linux ]'

- shell:
    - command: |
        set -eu
        retired="$HOME/.bin/agent-editor"
        if [ -L "$retired" ]; then
          case "$(readlink "$retired")" in
            */ai/.bin/agent-editor) unlink "$retired" ;;
          esac
        fi
      description: Remove retired agent editor link
    - command: |
        set -eu

        ssh_dir="$HOME/.ssh"
        ssh_config="$ssh_dir/config"
        include='Include ~/.ssh/config.d/*'

        umask 077
        mkdir -p "$ssh_dir"
        if [ -f "$ssh_config" ] && grep -Fqx "$include" "$ssh_config"; then
          chmod 600 "$ssh_config"
        else
          temporary="$(mktemp "$ssh_config.XXXXXX")"
          trap 'unlink "$temporary" 2>/dev/null || true' EXIT HUP INT TERM
          {
            printf '%s\n' "$include"
            if [ -f "$ssh_config" ]; then
              cat "$ssh_config"
            fi
          } > "$temporary"
          chmod 600 "$temporary"
          mv "$temporary" "$ssh_config"
          trap - EXIT HUP INT TERM
        fi
      description: Include managed SSH configuration
    # Initializing Zsh installs missing Zinit plugins without updating existing
    # checkouts. Version updates are explicit through `make update-zinit`.
    - command: |
        set -eu

        if command -v zsh >/dev/null 2>&1; then
          zsh -ic ':'
        fi
      description: Install missing Zinit plugins
    # Allow direnv access to ~/.envrc
    - ['[ -f "$HOME/.zinit/plugins/direnv---direnv/direnv" ] && direnv allow "$HOME" || true']
    - ['[ -f "$HOME/.zinit/plugins/mise/mise" ] && chmod u+x "$HOME/.zinit/plugins/mise/mise" || true']
    - command: |
        set -eu
        if ! command -v herdr >/dev/null 2>&1; then
          echo 'herdr not on PATH; skipping local plugins (mise install herdr)'
          exit 0
        fi
        if [ ! -d "$HOME/.config/herdr/plugins/config/drovr" ]; then
          env -u HERDR_SOCKET_PATH herdr plugin install "AVGVSTVS96/herdr-drovr" --yes
          echo 'herdr plugin: drovr'
        fi
        if command -v hwt >/dev/null 2>&1; then
          if [ ! -d "$HOME/.config/herdr/plugins/config/hwt.worktrees" ]; then
            env -u HERDR_SOCKET_PATH hwt plugin install
            echo 'herdr plugin: hwt.worktrees'
          fi
        else
          echo 'hwt not on PATH; skipping HWT plugin (mise install hwt)'
        fi
        installed="$(herdr plugin list --json)"
        for plugin in \
          command-palette \
          last-workspace \
          pane-collapse \
          pane-equalize \
          pane-rotate \
          pane-title \
          previous-pane-focus \
          seamless-navigation \
          window-title
        do
          plugin_id="brett.$plugin"
          source="brettinternet/herdr-plugins/$plugin"
          if printf '%s' "$installed" | jq -e --arg id "$plugin_id" \
            '.result.plugins[] | select(.plugin_id == $id and .source.kind == "local")' \
            >/dev/null; then
            herdr plugin unlink "$plugin_id"
          fi
          if ! printf '%s' "$installed" | jq -e --arg id "$plugin_id" --arg subdir "$plugin" \
            '.result.plugins[] | select(.plugin_id == $id and .source.kind == "github" and .source.owner == "brettinternet" and .source.repo == "herdr-plugins" and .source.subdir == $subdir)' \
            >/dev/null; then
            herdr plugin install "$source" --yes
            echo "herdr plugin: $plugin_id"
          fi
        done
      description: Install herdr plugins
      stdout: true
      stderr: true
    # Install plugins at the versions committed in lazy-lock.json. Deliberately
    # NOT `Lazy! sync`, which silently updates every plugin and rewrites the
    # lockfile during an unrelated dotfile install. Update with `make update-nvim`.
    - command: |
        set -eu

        if ! command -v nvim >/dev/null 2>&1; then
          exit 0
        fi

        nvim --headless \
          "+lua require('lazy').install({ lockfile = true, wait = true, show = false })" \
          "+lua require('lazy').restore({ wait = true, show = false })" \
          +qa
      description: Install Neovim plugins from lazy-lock.json
      stderr: true
    - command: |
        set -eu

        if ! command -v tmux >/dev/null 2>&1; then
          exit 0
        fi

        tmux_conf="$HOME/.tmux.conf"
        plugins_dir="$HOME/.tmux/plugins"

        if [ ! -f "$tmux_conf" ]; then
          exit 0
        fi

        mkdir -p "$plugins_dir"

        awk '/^[[:space:]]*set(-option)?[[:space:]]+-g[[:space:]]+@plugin[[:space:]]+/ {
          plugin = $4
          gsub(/["'"'"']/, "", plugin)
          print plugin
        }' "$tmux_conf" | while IFS= read -r plugin; do
          [ -n "$plugin" ] || continue

          plugin_name="${plugin##*/}"
          plugin_name="${plugin_name%.git}"
          plugin_dir="$plugins_dir/$plugin_name"

          case "$plugin" in
            *://*|git@*) plugin_url="$plugin" ;;
            *) plugin_url="https://github.com/$plugin" ;;
          esac

          if [ -d "$plugin_dir" ] && ! git -C "$plugin_dir" remote get-url origin >/dev/null 2>&1; then
            rm -rf "$plugin_dir"
          fi

          if [ -d "$plugin_dir" ]; then
            git -C "$plugin_dir" submodule update --init --recursive
          else
            GIT_TERMINAL_PROMPT=0 git clone --single-branch --recursive "$plugin_url" "$plugin_dir"
          fi
        done
      description: Install tmux plugins
      stdout: true
      stderr: true
