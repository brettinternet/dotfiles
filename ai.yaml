---
- defaults:
    link:
      create: true
      relink: true
- clean:
    - ~/.claude/commands
    - ~/.claude/skills
    - ~/.agents/skills
    # Reap the symlinks that predated install-agents before it regenerates them.
    - ~/.claude/agents
    - ~/.pi/agent/agents
    - ~/.pi/agent/themes
- shell:
    - command: ai/.bin/configure-ai-tools
      description: Install the selected AI tools and remove deselected managed tools
      stdout: true
      stderr: true
    - command: |
        set -eu
        shim_dir="$HOME/.local/share/mise/shims"
        bin_dir="$HOME/.local/bin"
        link_shim() {
          name=$1
          source="$shim_dir/$name"
          destination="$bin_dir/$name"
          if ai/.bin/ai-tool-enabled "$name"; then
            if [ ! -x "$source" ]; then
              if [ -L "$destination" ] && [ "$(readlink "$destination")" = "$source" ]; then
                trash "$destination"
              fi
              return 0
            fi
            if [ -L "$destination" ]; then
              [ "$(readlink "$destination")" = "$source" ] && return 0
              printf 'Refusing to replace unmanaged AI tool link: %s\n' "$destination" >&2
              exit 1
            elif [ -e "$destination" ]; then
              printf 'Refusing to overwrite unmanaged AI tool path: %s\n' "$destination" >&2
              exit 1
            fi
            mkdir -p "$bin_dir"
            ln -s "$source" "$destination"
          elif [ -L "$destination" ] && [ "$(readlink "$destination")" = "$source" ]; then
            trash "$destination"
          fi
        }
        for name in pi codex; do
          link_shim "$name"
        done
      description: Link enabled AI tools to stable Mise shims
      stdout: true
      stderr: true
    - command: python3 ai/generate-config.py
      description: Generate harness model catalogs and profiles from the central manifest
      stdout: true
      stderr: true
    - command: |
        set -eu
        ai/.bin/ai-tool-enabled pi || exit 0
        profile="$(ai/.bin/pi-profile show | cut -f1)"
        ai/.bin/pi-profile use "$profile"
      description: Regenerate active Pi profile settings from common + overlay
      stdout: true
      stderr: true
    - command: |
        if ai/.bin/ai-tool-enabled claude && command -v claude >/dev/null 2>&1; then
          for name in time chrome-devtools git; do
            claude mcp remove "$name" --scope user >/dev/null 2>&1 || true
          done
        fi
      description: Remove retired global MCP servers
      stdout: true
      stderr: true

    - command: |
        set -eu
        ai/.bin/ai-tool-enabled claude || exit 0
        mkdir -p "$HOME/.claude"
        target="$HOME/.claude/settings.json"
        if [ -L "$target" ]; then
          rm "$target"
        fi
        if [ -e "$target" ] && [ ! -f "$target" ]; then
          printf 'Claude settings target exists but is not a regular file: %s\n' "$target" >&2
          exit 1
        fi
        python3 ai/claude/merge-settings.py ai/claude/settings.json "$target"
      description: Merge managed preferences into Claude Code settings
      stdout: true
      stderr: true
    - command: |
        set -eu
        if ! command -v herdr >/dev/null 2>&1; then
          echo 'herdr not on PATH; skipping integrations (mise install herdr)'
          exit 0
        fi
        # Pi lifecycle state is owned by the pi-extensions Herdr bridge so async
        # subagents remain working after the parent turn settles.
        if ai/.bin/ai-tool-enabled pi; then
          herdr integration uninstall pi >/dev/null 2>&1 || true
          echo "herdr integration: pi lifecycle provided by pi-extensions"
        fi
        # Each integration refuses with a nonzero status when its agent's config
        # directory is absent, so skip those instead of failing the whole run.
        # Reinstalling is byte-idempotent: hook entries are replaced, not appended.
        for name in claude codex; do
          ai/.bin/ai-tool-enabled "$name" || continue
          if herdr integration install "$name" >/dev/null 2>&1; then
            echo "herdr integration: $name"
          else
            echo "herdr integration: $name skipped (agent not installed)"
          fi
        done
      description: Install Herdr agent integrations and select the Pi lifecycle provider
      stdout: true
      stderr: true
    - command: ai/.bin/install-dcg-guards
      description: Enforce destructive-command guards for installed AI harnesses
      stdout: true
      stderr: true
    - command: ai/.bin/install-agent-commands
      description: Generate shared skills and Claude command adapters
      stdout: true
      stderr: true
    - command: ai/.bin/install-agents
      description: Generate Claude, Pi, and Codex agent definitions
      stdout: true
      stderr: true

- link:
    ~/.bin/:
      glob: true
      path: ai/.bin/*
    # Claude
    ~/.claude/CLAUDE.md:
      path: ai/AGENTS.md
      if: ai/.bin/ai-tool-enabled claude
    ~/.claude/statusline-command.sh:
      path: ai/claude/statusline-command.sh
      if: ai/.bin/ai-tool-enabled claude
    ~/.claude/keybindings.json:
      path: ai/claude/keybindings.json
      if: ai/.bin/ai-tool-enabled claude
    ~/.claude/skills/:
      glob: true
      relink: false
      path: ai/.agents/skills/*
      if: ai/.bin/ai-tool-enabled claude
    # Pi
    ~/.pi/agent/AGENTS.md:
      path: ai/AGENTS.md
      if: ai/.bin/ai-tool-enabled pi
    ~/.pi/agent/models.json:
      path: ai/pi/models.json
      if: ai/.bin/ai-tool-enabled pi
    ~/.pi/agent/keybindings.json:
      path: ai/pi/keybindings.json
      if: ai/.bin/ai-tool-enabled pi
    ~/.pi/agent/lsp.json:
      path: ai/pi/lsp.json
      if: ai/.bin/ai-tool-enabled pi
    ~/.pi/agent/extensions/subagent/config.json:
      path: ai/pi/subagent-config.json
      if: ai/.bin/ai-tool-enabled pi
    # Codex
    ~/.codex/AGENTS.md:
      path: ai/AGENTS.md
      if: ai/.bin/ai-tool-enabled codex
    ~/.agents/skills/:
      glob: true
      relink: false
      path: ai/.agents/skills/*
      if: ai/.bin/ai-tool-enabled pi || ai/.bin/ai-tool-enabled codex
    # Amp CLI
    ~/.config/amp/settings.json:
      path: ai/amp/settings.json
      if: ai/.bin/ai-tool-enabled amp
    ~/.config/amp/AGENTS.md:
      path: ai/AGENTS.md
      if: ai/.bin/ai-tool-enabled amp
