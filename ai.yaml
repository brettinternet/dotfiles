---
- defaults:
    link:
      create: true
      relink: true
- clean:
    - ~/.claude/commands
    - ~/.claude/skills
    - ~/.agents/skills
    - ~/.omp/agent/skills
    # Reap the symlinks that predated install-agents before it regenerates them.
    - ~/.claude/agents
    - ~/.omp/agent/agents
    - ~/.pi/agent/agents
    - ~/.config/opencode/agents
    - ~/.config/opencode/commands
    - ~/.dsh/AGENTS.md
    - ~/.dsh/cordis.patch.yml
- shell:
    - command: |
        set -eu
        profile="$(ai/.bin/omp-profile show | cut -f1)"
        ai/.bin/omp-profile use "$profile"
      description: Regenerate active OMP profile config from common + overlay
      stdout: true
      stderr: true
    - command: |
        set -eu
        profile="$(ai/.bin/pi-profile show | cut -f1)"
        ai/.bin/pi-profile use "$profile"
      description: Regenerate active Pi profile settings from common + overlay
      stdout: true
      stderr: true
    - command: |
        set -eu
        profile="$(ai/.bin/opencode-profile show | cut -f1)"
        ai/.bin/opencode-profile use "$profile"
      description: Generate the active OpenCode config from its selected profile
      stdout: true
      stderr: true
    - command: |
        set -eu
        for name in ocx.jsonc oh-my-openagent.jsonc; do
          target="$HOME/.config/opencode/$name"
          if [ -e "$target" ] || [ -L "$target" ]; then
            trash "$target"
          fi
        done
      description: Remove retired OCX and oh-my-openagent configuration
      stdout: true
      stderr: true

    - command: |
        if command -v claude >/dev/null 2>&1; then
          for name in time chrome-devtools git; do
            claude mcp remove "$name" --scope user >/dev/null 2>&1 || true
          done
        fi
      description: Remove retired global MCP servers
      stdout: true
      stderr: true

    - command: |
        set -eu
        DOTFILES="$(pwd -P)"
        common="$DOTFILES/ai/omp/profiles/common.yml"
        link_shared() {
          source=$1
          destination=$2
          legacy_source=${3:-}
          if [ -L "$destination" ]; then
            current="$(readlink "$destination")"
            [ "$current" = "$source" ] && return 0
            if [ -n "$legacy_source" ] && [ "$current" = "$legacy_source" ]; then
              trash "$destination"
            else
              printf 'Refusing to replace unmanaged OMP profile link: %s\n' "$destination" >&2
              exit 1
            fi
          elif [ -e "$destination" ]; then
            printf 'Refusing to overwrite unmanaged OMP profile path: %s\n' "$destination" >&2
            exit 1
          fi
          ln -s "$source" "$destination"
        }
        require_managed_config() {
          destination=$1
          legacy_source=$2
          if [ -L "$destination" ]; then
            [ "$(readlink "$destination")" = "$legacy_source" ] || {
              printf 'Refusing to replace unmanaged OMP profile config: %s\n' "$destination" >&2
              exit 1
            }
            trash "$destination"
          elif [ -e "$destination" ]; then
            header="$(sed -n '1p' "$destination")"
            case "$header" in
              '# Generated by omp-profile from ai/omp/'*|'# Generated by pi-profile from ai/pi/'*) ;;
              *)
                printf 'Refusing to overwrite unmanaged OMP profile config: %s\n' "$destination" >&2
                exit 1
                ;;
            esac
          fi
        }
        profiles_root="$HOME/.omp/profiles"
        if [ -L "$profiles_root" ]; then
          printf 'Refusing to use linked OMP profiles directory: %s\n' "$profiles_root" >&2
          exit 1
        fi
        mkdir -p "$profiles_root"
        for src in "$DOTFILES/ai/omp/profiles"/*.yml; do
          [ -f "$src" ] || continue
          name="$(basename "$src" .yml)"
          [ "$name" = common ] && continue
          profile_dir="$profiles_root/$name"
          dir="$profile_dir/agent"
          if [ -L "$profile_dir" ] || [ -L "$dir" ]; then
            printf 'Refusing to use linked OMP profile directory: %s\n' "$profile_dir" >&2
            exit 1
          fi
          mkdir -p "$dir"
          config="$dir/config.yml"
          legacy_profile="$DOTFILES/ai/pi/profiles/$name.yml"
          require_managed_config "$config" "$legacy_profile"
          tmp="$config.tmp.$$"
          python3 "$DOTFILES/ai/omp/merge-profile.py" "$common" "$src" "$tmp"
          mv "$tmp" "$config"
          link_shared "$DOTFILES/ai/AGENTS.md" "$dir/AGENTS.md"
          link_shared "$DOTFILES/ai/omp/models.yml" "$dir/models.yml" "$DOTFILES/ai/pi/models.yml"
          link_shared "$DOTFILES/ai/omp/keybindings.yml" "$dir/keybindings.yml" "$DOTFILES/ai/pi/keybindings.yml"
          link_shared "$DOTFILES/ai/omp/mcp.json" "$dir/mcp.json" "$DOTFILES/ai/pi/mcp.json"
          link_shared "$DOTFILES/ai/WATCHDOG.md" "$dir/WATCHDOG.md"
          link_shared "$HOME/.omp/agent/agents" "$dir/agents"
        done
      description: Materialize OMP profiles with shared config and tooling
      stdout: true
      stderr: true

    - command: |
        set -eu
        mkdir -p "$HOME/.claude"
        target="$HOME/.claude/settings.json"
        if [ -L "$target" ]; then
          rm "$target"
        fi
        if [ -e "$target" ] && [ ! -f "$target" ]; then
          printf 'Claude settings target exists but is not a regular file: %s\n' "$target" >&2
          exit 1
        fi
        if [ ! -e "$target" ]; then
          cp ai/claude/settings.json "$target"
        fi
      description: Seed Claude Code settings as a local copy
      stdout: true
      stderr: true
    - command: |
        set -eu
        mkdir -p "$HOME/.dsh"
        target="$HOME/.dsh/settings.yaml"
        if [ -L "$target" ]; then
          rm "$target"
        fi
        if [ -e "$target" ] && [ ! -f "$target" ]; then
          printf 'DSH settings target exists but is not a regular file: %s\n' "$target" >&2
          exit 1
        fi
        if [ ! -e "$target" ]; then
          cp ai/dsh/settings.yaml "$target"
        fi
      description: Seed DSH settings as a local copy
      stdout: true
      stderr: true
    - command: |
        set -eu
        if ! command -v herdr >/dev/null 2>&1; then
          echo 'herdr not on PATH; skipping integrations (mise install herdr)'
          exit 0
        fi
        # Each integration refuses with a nonzero status when its agent's config
        # directory is absent, so skip those instead of failing the whole run.
        # Reinstalling is byte-idempotent: hook entries are replaced, not appended.
        for name in pi omp opencode claude codex; do
          if [ "$name" = opencode ] && [ ! -L "$HOME/.config/opencode/tui.jsonc" ]; then
            echo "herdr integration: opencode deferred until managed links exist"
            continue
          fi
          if herdr integration install "$name" >/dev/null 2>&1; then
            echo "herdr integration: $name"
          else
            echo "herdr integration: $name skipped (agent not installed)"
          fi
        done
      description: Install herdr agent integrations for locally installed agents
      stdout: true
      stderr: true
    - command: ai/.bin/install-dcg-guards
      description: Enforce destructive-command guards for installed AI harnesses
      stdout: true
      stderr: true
    - command: ai/.bin/install-agent-commands
      description: Generate shared skills plus Claude and OpenCode command adapters
      stdout: true
      stderr: true
    - command: ai/.bin/install-agents
      description: Generate Claude, OMP, Pi, OpenCode, and Codex agent definitions
      stdout: true
      stderr: true

- link:
    ~/.bin/:
      glob: true
      path: ai/.bin/*
    # Claude
    ~/.claude/CLAUDE.md:
      path: ai/AGENTS.md
    ~/.claude/statusline-command.sh:
      path: ai/claude/statusline-command.sh
    ~/.claude/keybindings.json:
      path: ai/claude/keybindings.json
    ~/.claude/skills/:
      glob: true
      relink: false
      path: ai/.agents/skills/*
    # Pi
    ~/.pi/agent/AGENTS.md:
      path: ai/AGENTS.md
    ~/.pi/agent/models.json:
      path: ai/pi/models.json
    ~/.pi/agent/keybindings.json:
      path: ai/pi/keybindings.json
    ~/.pi/agent/lsp.json:
      path: ai/pi/lsp.json
    # Oh My Pi
    ~/.omp/agent/AGENTS.md:
      path: ai/AGENTS.md
    ~/.omp/agent/models.yml:
      path: ai/omp/models.yml
    ~/.omp/agent/keybindings.yml:
      path: ai/omp/keybindings.yml
    ~/.omp/agent/mcp.json:
      path: ai/omp/mcp.json
    ~/.omp/agent/WATCHDOG.md:
      path: ai/WATCHDOG.md
    # Codex
    ~/.codex/AGENTS.md:
      path: ai/AGENTS.md
    ~/.agents/skills/:
      glob: true
      relink: false
      path: ai/.agents/skills/*
    # DeepSeek Harness
    ~/.dsh/AGENTS.md:
      path: ai/AGENTS.md
    ~/.dsh/cordis.patch.yml:
      path: ai/dsh/cordis.patch.yml
    ~/.dsh/.agent-presets:
      path: ai/dsh/presets
    # Amp CLI
    ~/.config/amp/settings.json:
      path: ai/amp/settings.json
    ~/.config/amp/AGENTS.md:
      path: ai/AGENTS.md
    # OpenCode
    ~/.config/opencode/AGENTS.md:
      path: ai/AGENTS.md
    ~/.config/opencode/tui.jsonc:
      path: ai/opencode/tui.jsonc
