---
- defaults:
    link:
      create: true
      relink: true
- clean:
    - ~/.claude/commands
    - ~/.claude/skills
    - ~/.agents/skills
    - ~/.omp/agent/skills
    # Reap the symlinks that predated install-agents before it regenerates them.
    - ~/.claude/agents
    - ~/.omp/agents
    - ~/.config/opencode/agents
    - ~/.config/opencode/commands
    - ~/.dsh/AGENTS.md
    - ~/.dsh/cordis.patch.yml
- shell:
    - command: |
        set -eu
        profile="$(ai/.bin/pi-profile show | cut -f1)"
        ai/.bin/pi-profile use "$profile"
      description: Regenerate active pi profile config from common + overlay
      stdout: true
      stderr: true
    - command: |
        set -eu
        profile="$(ai/.bin/opencode-profile show | cut -f1)"
        ai/.bin/opencode-profile use "$profile"
      description: Generate the active OpenCode config from its selected profile
      stdout: true
      stderr: true
    - command: |
        set -eu
        for name in ocx.jsonc oh-my-openagent.jsonc; do
          target="$HOME/.config/opencode/$name"
          if [ -e "$target" ] || [ -L "$target" ]; then
            trash "$target"
          fi
        done
      description: Remove retired OCX and oh-my-openagent configuration
      stdout: true
      stderr: true

    - command: |
        if command -v claude >/dev/null 2>&1; then
          for name in time chrome-devtools git; do
            claude mcp remove "$name" --scope user >/dev/null 2>&1 || true
          done
        fi
      description: Remove retired global MCP servers
      stdout: true
      stderr: true

    - command: |
        set -eu
        DOTFILES="$(pwd -P)"
        common="$DOTFILES/ai/pi/profiles/common.yml"
        link_shared() {
          source=$1
          destination=$2
          if [ -L "$destination" ]; then
            [ "$(readlink "$destination")" = "$source" ] && return 0
            printf 'Refusing to replace unmanaged pi profile link: %s\n' "$destination" >&2
            exit 1
          fi
          if [ -e "$destination" ]; then
            printf 'Refusing to overwrite unmanaged pi profile path: %s\n' "$destination" >&2
            exit 1
          fi
          ln -s "$source" "$destination"
        }
        for src in "$DOTFILES/ai/pi/profiles"/*.yml; do
          [ -f "$src" ] || continue
          name="$(basename "$src" .yml)"
          [ "$name" = common ] && continue
          dir="$HOME/.omp/profiles/$name/agent"
          mkdir -p "$dir"
          tmp="$dir/config.yml.tmp.$$"
          python3 "$DOTFILES/ai/pi/merge-profile.py" "$common" "$src" "$tmp"
          mv "$tmp" "$dir/config.yml"
          link_shared "$DOTFILES/ai/AGENTS.md" "$dir/AGENTS.md"
          link_shared "$DOTFILES/ai/pi/models.yml" "$dir/models.yml"
          link_shared "$DOTFILES/ai/pi/keybindings.yml" "$dir/keybindings.yml"
          link_shared "$DOTFILES/ai/pi/mcp.json" "$dir/mcp.json"
          link_shared "$DOTFILES/ai/WATCHDOG.md" "$dir/WATCHDOG.md"
          link_shared "$HOME/.omp/agent/agents" "$dir/agents"
        done
      description: Materialize pi profiles with shared config and tooling
      stdout: true
      stderr: true

    - command: |
        set -eu
        mkdir -p "$HOME/.claude"
        target="$HOME/.claude/settings.json"
        if [ -L "$target" ]; then
          rm "$target"
        fi
        if [ -e "$target" ] && [ ! -f "$target" ]; then
          printf 'Claude settings target exists but is not a regular file: %s\n' "$target" >&2
          exit 1
        fi
        if [ ! -e "$target" ]; then
          cp ai/claude/settings.json "$target"
        fi
      description: Seed Claude Code settings as a local copy
      stdout: true
      stderr: true
    - command: |
        set -eu
        mkdir -p "$HOME/.dsh"
        target="$HOME/.dsh/settings.yaml"
        if [ -L "$target" ]; then
          rm "$target"
        fi
        if [ -e "$target" ] && [ ! -f "$target" ]; then
          printf 'DSH settings target exists but is not a regular file: %s\n' "$target" >&2
          exit 1
        fi
        if [ ! -e "$target" ]; then
          cp ai/dsh/settings.yaml "$target"
        fi
      description: Seed DSH settings as a local copy
      stdout: true
      stderr: true
    - command: |
        set -eu
        if ! command -v herdr >/dev/null 2>&1; then
          echo 'herdr not on PATH; skipping integrations (mise install herdr)'
          exit 0
        fi
        # Each integration refuses with a nonzero status when its agent's config
        # directory is absent, so skip those instead of failing the whole run.
        # Reinstalling is byte-idempotent: hook entries are replaced, not appended.
        for name in omp opencode claude codex; do
          if herdr integration install "$name" >/dev/null 2>&1; then
            echo "herdr integration: $name"
          else
            echo "herdr integration: $name skipped (agent not installed)"
          fi
        done
      description: Install herdr agent integrations for locally installed agents
      stdout: true
      stderr: true
    - command: ai/.bin/install-agent-commands
      description: Generate shared skills plus Claude and OpenCode command adapters
      stdout: true
      stderr: true
    - command: ai/.bin/install-agents
      description: Generate Claude, pi, OpenCode, and Codex agent definitions
      stdout: true
      stderr: true

- link:
    ~/.bin/:
      glob: true
      path: ai/.bin/*
    # Claude
    ~/.claude/CLAUDE.md:
      path: ai/AGENTS.md
    ~/.claude/statusline-command.sh:
      path: ai/claude/statusline-command.sh
    ~/.claude/skills/:
      glob: true
      relink: false
      path: ai/.agents/skills/*
    # Oh My Pi
    ~/.omp/agent/AGENTS.md:
      path: ai/AGENTS.md
    ~/.omp/agent/models.yml:
      path: ai/pi/models.yml
    ~/.omp/agent/keybindings.yml:
      path: ai/pi/keybindings.yml
    ~/.omp/agent/mcp.json:
      path: ai/pi/mcp.json
    ~/.omp/agent/WATCHDOG.md:
      path: ai/WATCHDOG.md
    # Codex
    ~/.codex/AGENTS.md:
      path: ai/AGENTS.md
    ~/.agents/skills/:
      glob: true
      relink: false
      path: ai/.agents/skills/*
    # DeepSeek Harness
    ~/.dsh/AGENTS.md:
      path: ai/AGENTS.md
    ~/.dsh/cordis.patch.yml:
      path: ai/dsh/cordis.patch.yml
    ~/.dsh/.agent-presets:
      path: ai/dsh/presets
    # Amp CLI
    ~/.config/amp/settings.json:
      path: ai/amp/settings.json
    ~/.config/amp/AGENTS.md:
      path: ai/AGENTS.md
    # OpenCode
    ~/.config/opencode/AGENTS.md:
      path: ai/AGENTS.md
    ~/.config/opencode/tui.jsonc:
      path: ai/opencode/tui.jsonc
