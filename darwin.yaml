---
- defaults:
    link:
      create: true
      relink: true

- create:
    - ~/dev
    - ~/dev/me
    - ~/dev/sandbox
    - ~/dev/work

- clean:
    - ~/.hammerspoon

- link:
    ~/.gitconfig:
      path: darwin/.gitconfig
    ~/.gitignore:
      path: darwin/.gitignore
    ~/.zprofile:
      path: darwin/.zprofile
    ~/.hushlogin:
      path: darwin/.hushlogin
    ~/.aerospace.toml:
      path: darwin/.aerospace.toml
    ~/.functions/:
      glob: true
      path: darwin/.functions/*
    ~/.zshrc.darwin:
      path: darwin/.zshrc.darwin
    ~/.hammerspoon/:
      glob: true
      path: darwin/.hammerspoon/*
      if: "[ -d /Applications/Hammerspoon.app ]"
    ~/.config/ghostty/:
      glob: true
      path: darwin/.config/ghostty/*
      if: '[ -x "$(command -v ghostty)" ]'
    ~/.config/mise/conf.d/:
      glob: true
      path: darwin/.config/mise/conf.d/*
      if: '[ -x "$(command -v mise)" ]'
    ~/.config/nix-darwin/:
      glob: true
      path: darwin/.config/nix-darwin/*
      if: '[ -x "$(command -v nix)" ]'
    ~/.vscode/extensions/local.kaile-theme:
      path: darwin/vscode/extensions/kaile-theme

- shell:
    # gh-stack is user-scoped; converge it through Mise after linking its configuration.
    - command: |
        if command -v mise >/dev/null 2>&1; then
          mise exec gh -- gh extension install github/gh-stack --force
        fi
    - command: |
        set -eu
        if ! command -v mise >/dev/null 2>&1; then
          exit 0
        fi

        mise install pnpm npm:@deepseek-ai/dsh npm:@deepseek-harness-tui/dsh-tui
        mise exec -- dsh plugin --profile dsh-tui add @deepseek-harness-tui/dsh-tui@latest
      description: Install DeepSeek Harness and converge the dsh-tui profile
      stdout: true
      stderr: true
