---
- defaults:
    link:
      create: true
      relink: true

- create:
    - ~/dev
    - ~/dev/me
    - ~/dev/sandbox
    - ~/dev/work

- clean:
    - ~/.hammerspoon

- link:
    ~/.gitconfig:
      path: darwin/.gitconfig
    ~/.gitignore:
      path: darwin/.gitignore
    ~/.zprofile:
      path: darwin/.zprofile
    ~/.hushlogin:
      path: darwin/.hushlogin
    ~/.functions/:
      glob: true
      path: darwin/.functions/*
    ~/.zshrc.darwin:
      path: darwin/.zshrc.darwin
    ~/.hammerspoon/:
      glob: true
      path: darwin/.hammerspoon/*
      if: "[ -d /Applications/Hammerspoon.app ]"
    ~/.config/ghostty/:
      glob: true
      path: darwin/.config/ghostty/*
      if: '[ -x "$(command -v ghostty)" ]'
    ~/Library/Application Support/nushell/config.nu:
      path: base/nushell/config.nu
      force: true
    ~/Library/Application Support/nushell/conf.d/:
      glob: true
      path: base/nushell/conf.d/*
    ~/.config/mise/conf.d/:
      glob: true
      path: darwin/.config/mise/conf.d/*
      if: '[ -x "$(command -v mise)" ]'
    ~/.dsh/profiles/dsh-tui/package.json:
      path: darwin/.dsh/profiles/dsh-tui/package.json
      force: true
    ~/.dsh/profiles/dsh-tui/cordis.patch.yml:
      path: darwin/.dsh/profiles/dsh-tui/cordis.patch.yml
      force: true
    ~/.config/nix-darwin/:
      glob: true
      path: darwin/.config/nix-darwin/*
      if: '[ -x "$(command -v nix)" ]'
    ~/.vscode/extensions/local.kaile-theme:
      path: darwin/vscode/extensions/kaile-theme

- shell:
    # gh-stack is user-scoped; converge it through Mise after linking its configuration.
    - command: |
        if command -v mise >/dev/null 2>&1; then
          mise exec gh -- gh extension install github/gh-stack --force
        fi
    - command: |
        if command -v bun >/dev/null 2>&1; then
          bun install --omit peer --cwd "$HOME/.dsh/profiles/dsh-tui"
        fi
      description: Install the dsh-tui profile with Bun
      stdout: true
      stderr: true
    - command: >-
        hidutil property --set
        '{"UserKeyMapping":[{"HIDKeyboardModifierMappingSrc":0x700000039,"HIDKeyboardModifierMappingDst":0x700000029}]}'
      description: Remap Caps Lock to Escape
      stdout: true
