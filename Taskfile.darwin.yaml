---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  BREWFILE: "{{.ROOT_DIR}}/darwin/Brewfile"
  BREW_SH: "{{.ROOT_DIR}}/darwin/setup.sh"

tasks:
  init:
    desc: Darwin setup
    cmds:
      - task: brew

  brew:
    desc: Install workstation dependencies with Brew
    cmd: "{{.BREW_SH}}"
    preconditions:
      - { msg: "Missing Brewfile", sh: "test -f {{.BREWFILE}}" }

  lid-awake:
    desc: Install the optional closed-lid awake helper (sudo once; keep lid open; -- --admin USER)
    cmd: python3 "{{.ROOT_DIR}}/darwin/scripts/install-lid-awake.py" {{.CLI_ARGS}}

  browser:
    desc: Install default browser handler with custom arguments
    cmd: chromium-apps --install-url-handler --enable-remote-debugging --set-default

  window-rules:
    desc: Install the per-user window-rules agent (defers the MDM restart prompt; needs Device Control and Data Access)
    cmd: python3 "{{.ROOT_DIR}}/darwin/scripts/install-window-rules.py"

  window-rules-check:
    desc: Confirm the window-rules agent can defer a test restart prompt (shows it briefly)
    silent: true
    vars:
      DIALOG: /Library/Application Support/Dialog/Dialog.app/Contents/MacOS/Dialog
    preconditions:
      - { msg: "swiftDialog is not installed", sh: 'test -x "{{.DIALOG}}"' }
      - msg: "Agent not loaded; run task setup:window-rules"
        sh: launchctl print "gui/$(id -u)/local.window-rules" >/dev/null 2>&1
    cmds:
      - |
        # Exit 10 is swiftDialog's quit key, which the agent sends; 4 means the timer ran out.
        status=0
        "{{.DIALOG}}" --title "Restart required" --message "window-rules check: this closes itself" \
          --button1text "Restart now" --timer 15 --position bottomright >/dev/null 2>&1 || status=$?
        if [ "$status" -eq 10 ]; then
          echo "window-rules: access granted; test prompt deferred"
        else
          echo "window-rules: test prompt not deferred (exit $status). Check Device Control and Data Access"
          echo "and ~/Library/Logs/local.window-rules.log"
          exit 1
        fi

  undo-escape:
    desc: Undo the capslock -> escape remap
    cmd: hidutil property --set '{"UserKeyMapping":[]}'
